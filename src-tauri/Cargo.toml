[package]
name = "max-proxy-mock"
version = "0.2.1"
description = "Local API recording, mocking and contract convergence desktop app"
authors = ["Max Proxy Mock"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "max_proxy_mock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
http-body-util = "0.1"
hudsucker = { path = "vendor/hudsucker", features = ["http2"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
